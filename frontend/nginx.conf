server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;

  # Docker'ın iç DNS'i: API konteyneri yeniden başlayıp yeni IP alırsa
  # nginx eski adrese takılı kalmasın (502), adresi 10 sn'de bir yeniden sorgular.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 90s;
  }
  location = /health { proxy_pass $api_upstream; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
