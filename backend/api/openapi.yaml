      summary: "Kullanıcı oluştur"
      tags: [admin]
      x-roles: ["admin"]
      security: [{bearer: []}]
      requestBody: {content: {application/json: {example: {"email": "x@y.example", "password": "Demo123!", "full_name": "X", "role": "attendee"}}}}
