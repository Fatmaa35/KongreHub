openapi: 3.0.3
info:
  title: KongreHub API
  version: 1.0.0
  description: |
    Bilimsel kongre, çift kör hakem değerlendirmesi, program ve kayıt yönetimi.
    Hata biçimi her uçta aynıdır: {"error":{"code":"...","message":"..."}}.
    x-roles: uca erişebilen roller (boş = oturum açmış herkes). Rol dışı çağrı 403, oturumsuz 401 döner.
    Büyük listeler keyset sayfalıdır: ?limit=&cursor= → next_cursor.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128},
      description: 'Aynı anahtarla tekrar istek ilk yanıtı aynen döner (Idempotent-Replayed: true); farklı gövde 422.'}
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties: {code: {type: string}, message: {type: string}, details: {type: object}}
  responses:
    Error: {description: Hata, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
paths:
  /health:
    get: {summary: 'Sağlık (veritabanı + depolama); 200 veya 503', tags: [ops], responses: {'200': {description: OK}, '503': {$ref: '#/components/responses/Error'}}}
  /metrics:
    get: {summary: Prometheus metrikleri, tags: [ops], responses: {'200': {description: text/plain}}}
  /api/admin/audit:
    get:
      summary: "GET /api/admin/audit"
      tags: [admin]
      x-roles: ["admin"]
      security: [{bearer: []}]
      responses:
        '200': {description: Başarılı}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/admin/clock:
    get:
      summary: "GET /api/admin/clock"
      tags: [admin]
      x-roles: ["admin", "editor"]
      security: [{bearer: []}]
      responses:
        '200': {description: Başarılı}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      summary: "(DEMO_MODE) uygulama saatini ileri al"
      tags: [admin]
      x-roles: ["admin"]
      security: [{bearer: []}]
      requestBody: {content: {application/json: {example: {"offset_hours": 0}}}}
      responses:
        '200': {description: Başarılı}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/admin/demo/backdate-assignment:
    post:
      summary: "(DEMO_MODE) tek atamayı geriye tarihle"
      tags: [admin]
      x-roles: ["admin"]
      security: [{bearer: []}]
      requestBody: {content: {application/json: {example: {"assignment_id": 1, "days": 15}}}}
      responses:
        '200': {description: Başarılı}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
